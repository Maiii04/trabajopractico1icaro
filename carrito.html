<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="RUN - Tienda de artículos deportivos">
        <meta name="keywords" content="deporte, zapatillas, gym, running">
        <link rel="icon" href="imag/logo.png" type="image/png">

        <title>RUN - Tienda Deportiva</title>
        

        <link rel="stylesheet" href="css/carrito.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    </head>

    <body>
       <header>
            <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#ed3237 ;">
                <div class="container-fluid">
                    <a class="navbar-brand text-white"title="Inicio" href="index.html">RUN</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon "></span>
                            <span class="texto-menu text-white ">Mas</span>
                        </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active  text-white text-center" title="Inicio" href="index.html">
                                <span class="material-symbols-outlined d-block">home</span> 
                                Inicio
                                </a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link  text-white text-center"title="Productos"href="contenido.html">
                                <span class="material-symbols-outlined d-block">store</span>
                                Productos 
                            </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link  text-white text-center"title="Contacto" href="contacto.html">
                                    <span class="material-symbols-outlined d-block">chat</span>
                                    Contactanos
                                </a>
                            </li>
                             <li class="nav-item">
                            <a class="nav-link  text-white text-center"title="Productos"href="carrito.html">
                                <span class="material-symbols-outlined d-block">shopping_cart </span>
                                Carrito 
                            </a>
                            </li>

                        </ul>
                            <form class="d-flex" role="search">
                                <input class="form-control me-2  text-white" type="search" placeholder="Buscar productos">
                                <button class="btn btn-light  text-black" type="submit">Buscar</button>
                            </form>

                    </div>
                </div>
            </nav>

        </header>
                <main class="container mt-4">

    <!-- HEADER -->
    <h2 class="text-center text-dark fw-bold mb-4">
         Carrito
    </h2>

    <!-- LAYOUT PRINCIPAL -->
    <div class="row g-4">

        <!-- CARRITO (IZQUIERDA) -->
        <div class="col-lg-7">

            <div class="card shadow border-0 p-3">

                <div id="listaProductos" class="mb-3"></div>

                <h4 class="d-flex justify-content-between mt-3">
                    <span>Total:</span>
                    <span id="total" class="text-danger fw-bold fs-4">$0</span>
                </h4>

            </div>

        </div>

        <!-- SIMULADOR (DERECHA) -->
        <div class="col-lg-5">

            <div class="card shadow border-0 p-4 h-100">

                <h4 class="text-danger fw-bold mb-3 text-center"> Forma de Pago
                </h4>


                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="formaPago" id="efectivo" value="efectivo" checked>
                    <label class="form-check-label" for="efectivo">
                        Efectivo (20% descuento)
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="formaPago" id="tarjeta" value="tarjeta">
                    <label class="form-check-label" for="tarjeta">
                        Tarjeta (15% recargo)
                    </label>
                </div>

                <div class="mb-3" id="contenedorCuotas">

                    <label class="form-label fw-bold">
                        Cuotas
                    </label>

                    <select id="cuotas" class="form-select mb-3">
                        <option value="1">1 cuota</option>
                        <option value="3">3 cuotas</option>
                        <option value="6">6 cuotas</option>
                        <option value="12">12 cuotas</option>
                    </select>
                </div>

                <button class="btn btn-danger btn-sm w-100 fw-bold"
                    onclick="calcularCompra()">
                    Calcular Compra
                </button>

            </div>

        </div>

    </div>

    <!-- RESUMEN ABAJO -->
    <div class="row mt-4">

        <div class="col-12">

            <div class="card shadow border-0 p-4">

                <h4 class="text-danger fw-bold text-center mb-3">
                    Resumen de Compra
                </h4>

                <div class="d-flex justify-content-between">
                    <span>Subtotal:</span>
                    <span id="subtotalFinal">$0</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <span>Descuento / Recargo:</span>
                    <span id="detallePago">$0</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between fs-5">
                    <span class="fw-bold">Total Final:</span>
                    <span id="totalFinal" class="text-success fw-bold">$0</span>
                </div>

                <div class="d-flex justify-content-between mt-2">
                    <span>Valor por cuota:</span>
                    <span id="valorCuota">$0</span>
                </div>

            </div>

        </div>

    </div>

</main>
    <script src="js/carrito.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
